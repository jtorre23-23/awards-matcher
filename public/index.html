<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Awards Matcher — Alloy Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --ink-2: #4a4a47;
    --ink-3: #8a8a86;
    --surface: #ffffff;
    --surface-2: #f4f8f9;
    --surface-3: #e6f2f3;
    --border: #d0e4e6;
    --teal: #008E98;
    --teal-dark: #006d75;
    --cyan: #00C9DC;
    --accent: #008E98;
    --accent-light: #e0f5f7;
    --cta: #FF6D00;
    --cta-dark: #e05f00;
    --success: #1a6b3a;
    --success-light: #e6f4ec;
    --warning: #7a4f00;
    --warning-light: #fef4e0;
    --radius: 10px;
    --font: "Open Sans", system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.7;
    background: var(--surface-2);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
  }

  header {
    background: linear-gradient(135deg, var(--teal) 0%, var(--cyan) 100%);
    min-height: 80px;
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left { display: flex; flex-direction: column; justify-content: center; }

  .header-logo {
    display: block;
    width: 180px;
    height: auto;
    filter: brightness(0) invert(1);
  }

  .header-tagline {
    font-size: 1rem;
    color: rgba(255,255,255,0.82);
    font-weight: 400;
    margin-top: 0.4rem;
    letter-spacing: 0.01em;
  }

  .header-tool {
    font-size: 1rem;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .progress-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    gap: 0;
  }

  .progress-step {
    padding: 0.85rem 0;
    margin-right: 2rem;
    font-size: 15px;
    color: var(--ink-3);
    border-bottom: 2px solid transparent;
    cursor: default;
  }

  .progress-step.active {
    color: var(--ink);
    border-bottom-color: var(--teal);
    font-weight: 600;
  }

  .progress-step.done {
    color: var(--success);
    border-bottom-color: var(--success);
  }

  main {
    max-width: 720px;
    margin: 2.5rem auto;
    padding: 0 1.5rem 4rem;
  }

  .view { display: none; }
  .view.active { display: block; }

  .view-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 0.4rem;
    letter-spacing: -0.01em;
  }

  .view-sub {
    font-size: 16px;
    color: var(--ink-2);
    margin-bottom: 2rem;
    line-height: 1.7;
  }

  .form-section {
    margin-bottom: 2rem;
  }

  .form-section-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 0.75rem;
    display: block;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .field-row.single { grid-template-columns: 1fr; }

  input[type="text"], select, textarea {
    width: 100%;
    padding: 0.6rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px;
    font-family: var(--font);
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="text"]:focus, select:focus, textarea:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(0,142,152,0.1);
  }

  textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.7;
  }

  .tab-bar {
    display: flex;
    border-bottom: 2px solid var(--border);
    margin-bottom: 2rem;
  }

  .tab {
    padding: 0.75rem 1.5rem;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
    color: var(--ink-3);
    transition: color 0.15s, border-color 0.15s;
  }

  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
  .tab:hover:not(.active) { color: var(--ink); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0.7rem 1.5rem;
    border-radius: var(--radius);
    font-size: 16px;
    font-family: var(--font);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }

  .btn-primary {
    background: var(--cta);
    color: white;
    box-shadow: 0 2px 8px rgba(255,109,0,0.25);
  }

  .btn-primary:hover { background: var(--cta-dark); box-shadow: 0 3px 12px rgba(255,109,0,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  .btn-ghost {
    background: none;
    color: var(--ink-2);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { background: var(--surface-3); color: var(--ink); border-color: var(--teal); }

  .error {
    display: none;
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: #b91c1c;
    padding: 0.6rem 0.85rem;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: var(--radius);
  }

  /* Results */
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.5rem;
  }

  .profile-pill {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.75rem;
  }

  .pill {
    padding: 0.3rem 0.7rem;
    background: var(--surface-3);
    border-radius: 20px;
    font-size: 14px;
    color: var(--ink-2);
  }

  .loading {
    display: none;
    text-align: center;
    padding: 3rem 0;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-size: 0.875rem;
    color: var(--ink-3);
  }

  .award-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
    margin-bottom: 1rem;
    border-left: 3px solid var(--teal);
  }

  .award-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.3rem;
  }

  .award-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    white-space: nowrap;
    margin-left: 12px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-high { background: var(--success-light); color: var(--success); }
  .badge-med { background: var(--warning-light); color: var(--warning); }

  .award-org {
    font-size: 15px;
    color: var(--ink-3);
    margin-bottom: 1rem;
  }

  .award-deadline {
    display: inline-block;
    margin-left: 10px;
    padding: 0.15rem 0.5rem;
    background: var(--surface-2);
    border-radius: 4px;
    font-size: 0.72rem;
    color: var(--ink-2);
  }

  .award-body {
    border-top: 1px solid var(--surface-3);
    padding-top: 0.9rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .award-section-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--teal);
    margin-bottom: 0.3rem;
  }

  .award-section-text {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.7;
  }

  .award-actions {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
  }

  .nominate-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 15px;
    color: var(--cta);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: var(--font);
    font-weight: 600;
  }

  .nominate-btn:hover { text-decoration: underline; color: var(--cta-dark); }

  .award-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 15px;
    color: var(--teal);
    font-weight: 600;
    text-decoration: none;
    font-family: var(--font);
  }

  .award-link:hover { text-decoration: underline; color: var(--teal-dark); }

  .nominate-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 15px;
    color: var(--cta);
    font-weight: 600;
    text-decoration: none;
    font-family: var(--font);
  }

  .nominate-link:hover { text-decoration: underline; color: var(--cta-dark); }

  @media (max-width: 600px) {
    .field-row { grid-template-columns: 1fr; }
    .award-body { grid-template-columns: 1fr; }
    header { padding: 1.5rem 1.25rem; }
    main { margin: 1.5rem auto; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="/alloy-labs-logo.png" alt="Alloy Labs" class="header-logo" />
    <div class="header-tagline">Banking, unbound.</div>
  </div>
  <div class="header-tool">Awards Matcher</div>
</header>

<nav class="progress-bar" aria-label="Progress">
  <div class="progress-step active" id="ps1">Member profile</div>
  <div class="progress-step" id="ps2">Matching awards</div>
  <div class="progress-step" id="ps3">Nomination ready</div>
</nav>

<main>

  <!-- FORM VIEW -->
  <div class="view active" id="view-form">
    <h2 class="view-title">Find matching awards</h2>
    <p class="view-sub">Enter what you know — we'll match to real awards and nomination opportunities.</p>

    <div class="tab-bar">
      <button class="tab active" data-tab="bank">Bank Member</button>
      <button class="tab" data-tab="fintech">Fintech Company</button>
    </div>

    <!-- Bank Member -->
    <div class="tab-panel active" id="panel-bank">
      <div class="form-section">
        <div class="field-row">
          <input type="text" id="b-name" placeholder="Member name" />
          <input type="text" id="b-title" placeholder="Job title" />
        </div>
        <div class="field-row">
          <input type="text" id="b-bank" placeholder="Bank name" />
          <input type="text" id="b-state" placeholder="State" />
        </div>
        <div class="field-row single">
          <textarea id="b-achievements" placeholder="What has this member accomplished? Even rough notes — e.g. led core conversion, launched a CDFI fund, grew deposits 30%, merged two banks"></textarea>
        </div>
      </div>
    </div>

    <!-- Fintech Company -->
    <div class="tab-panel" id="panel-fintech">
      <div class="form-section">
        <div class="field-row">
          <input type="text" id="ft-name" placeholder="Founder or executive name" />
          <input type="text" id="ft-title" placeholder="Title" />
        </div>
        <div class="field-row">
          <input type="text" id="ft-company" placeholder="Company name" />
          <input type="text" id="ft-state" placeholder="State" />
        </div>
        <div class="field-row single">
          <textarea id="ft-achievements" placeholder="What has this company accomplished? E.g. reached $10M ARR, raised Series A, serves 50 community banks, launched embedded lending product"></textarea>
        </div>
      </div>
    </div>

    <div id="form-error" class="error"></div>
    <button class="btn btn-primary" id="find-btn" onclick="submitProfile()">Find Awards →</button>
  </div>

  <!-- RESULTS VIEW -->
  <div class="view" id="view-results">
    <div class="results-header">
      <div>
        <h2 class="view-title" id="results-title">Matching awards</h2>
        <p class="view-sub" style="margin-bottom:0" id="results-sub"></p>
      </div>
      <button class="btn btn-ghost" onclick="reset()" style="margin-top:4px">← New profile</button>
    </div>

    <div class="profile-pill" id="profile-pills"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Searching for awards…</p>
    </div>

    <div id="awards-list"></div>
  </div>

</main>

<script>
  let activeTab = 'bank';

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('panel-' + activeTab).classList.add('active');
    });
  });

  function setStep(n) {
    [1,2,3].forEach(i => {
      const el = document.getElementById('ps' + i);
      el.className = 'progress-step' + (i < n ? ' done' : i === n ? ' active' : '');
    });
  }

  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function getProfile() {
    if (activeTab === 'bank') {
      return {
        type: 'bank',
        name: document.getElementById('b-name').value.trim(),
        title: document.getElementById('b-title').value.trim(),
        company: document.getElementById('b-bank').value.trim(),
        state: document.getElementById('b-state').value.trim(),
        achievements: document.getElementById('b-achievements').value.trim(),
      };
    } else {
      return {
        type: 'fintech',
        name: document.getElementById('ft-name').value.trim(),
        title: document.getElementById('ft-title').value.trim(),
        company: document.getElementById('ft-company').value.trim(),
        state: document.getElementById('ft-state').value.trim(),
        achievements: document.getElementById('ft-achievements').value.trim(),
      };
    }
  }

  async function submitProfile() {
    const p = getProfile();
    const errEl = document.getElementById('form-error');
    errEl.style.display = 'none';

    function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }

    if (!p.name) return showErr('Please enter a name.');
    if (!p.company) return showErr('Please enter a ' + (activeTab === 'bank' ? 'bank' : 'company') + ' name.');
    if (!p.achievements) return showErr('Please describe some key achievements.');

    setStep(2);
    showView('view-results');
    document.getElementById('loading').style.display = 'block';
    document.getElementById('awards-list').innerHTML = '';

    const pills = [p.name, p.title, p.company, p.state].filter(Boolean);
    document.getElementById('profile-pills').innerHTML = pills.map(x => `<span class="pill">${x}</span>`).join('');
    document.getElementById('results-title').textContent = `Awards for ${p.name || p.company}`;
    document.getElementById('results-sub').textContent = 'Reviewing profile and searching for matches…';

    try {
      const res = await fetch('/api/match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile: p })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const text = data.content.find(b => b.type === 'text')?.text || '';
      const clean = text.replace(/```json|```/g, '').trim();
      const awards = JSON.parse(clean);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('results-sub').textContent = `${awards.length} awards found — sorted by match strength`;
      setStep(3);
      renderAwards(awards, p);
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('awards-list').innerHTML =
        `<div style="color:#b91c1c;font-size:.875rem;padding:1rem;background:#fef2f2;border-radius:var(--radius);border:1px solid #fecaca">
          Could not load awards. Make sure your server is running with a valid ANTHROPIC_API_KEY. (${e.message})
        </div>`;
    }
  }

  function renderAwards(awards, p) {
    const sorted = [...awards].sort((a,b) => a.match === 'High' && b.match !== 'High' ? -1 : 1);
    document.getElementById('awards-list').innerHTML = sorted.map(a => `
      <div class="award-card">
        <div class="award-top">
          <span class="award-name">${a.award_name}</span>
          <span class="badge ${a.match === 'High' ? 'badge-high' : 'badge-med'}">${a.match} match</span>
        </div>
        <div class="award-org">
          ${a.org}
          <span class="award-deadline">📅 ${a.deadline_season}</span>
        </div>
        <div class="award-body">
          <div>
            <div class="award-section-label">Why they fit</div>
            <div class="award-section-text">${a.fit_reason}</div>
          </div>
          <div>
            <div class="award-section-label">Nomination angle</div>
            <div class="award-section-text">${a.nomination_angle}</div>
          </div>
        </div>
        <div class="award-actions">
          ${a.nomination_url ? `<a class="nominate-link" href="${a.nomination_url}" target="_blank" rel="noopener noreferrer">Register / Nominate →</a>` : ''}
          <button class="nominate-btn" onclick="draftNomination(${JSON.stringify(a).replace(/"/g, '&quot;')}, ${JSON.stringify(p).replace(/"/g, '&quot;')})">
            Draft nomination →
          </button>
          ${a.website_url ? `<a class="award-link" href="${a.website_url}" target="_blank" rel="noopener noreferrer">Visit award page →</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  function draftNomination(award, profile) {
    const q = encodeURIComponent(`Draft a nomination for ${profile.name} for the "${award.award_name}" award by ${award.org}. Their key achievements: ${profile.achievements}. Nomination angle: ${award.nomination_angle}`);
    window.open(`https://claude.ai/new?q=${q}`, '_blank');
  }

  function reset() {
    setStep(1);
    showView('view-form');
    ['b-name','b-title','b-bank','b-state','b-achievements',
     'ft-name','ft-title','ft-company','ft-state','ft-achievements'].forEach(id => {
      document.getElementById(id).value = '';
    });
    activeTab = 'bank';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'bank'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-bank'));
    document.getElementById('form-error').style.display = 'none';
  }
</script>
</body>
</html>
